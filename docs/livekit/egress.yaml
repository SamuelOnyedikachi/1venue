# LiveKit Egress config for 1venue replays (room composite → MP4 → Cloudflare R2).
# Mount at /etc/egress.yaml (see egress-compose.yml) or paste into EGRESS_CONFIG_BODY.
log_level: info
api_key: <LIVEKIT_API_KEY>            # same key/secret as the LiveKit server and the 1venue app
api_secret: <LIVEKIT_API_SECRET>
ws_url: wss://rtc.1venue.live        # or ws://livekit:7880 on the shared Docker network
insecure: false
redis:                               # MUST be the same Redis the LiveKit server uses
  address: redis:6379
  password: <redis password>
health_port: 8080
# Refuse new jobs when the node is busy instead of dropping frames.
# Room composite costs ~3 CPU by default; lower only if you record at low resolution.
cpu_cost:
  room_composite_cpu_cost: 3.0
# Default upload target. 1venue also sends the R2 target with every request.
s3:
  access_key: <R2 access key id>
  secret: <R2 secret>
  region: auto
  endpoint: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
  bucket: 1venue-uploads
  force_path_style: true
