<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 520px;
        height: 392px;
        background: transparent;
        font-family:
          "Inter",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      .stage {
        position: relative;
        width: 520px;
        height: 392px;
        border-radius: 28px;
        overflow: hidden;
        background: radial-gradient(
          120% 90% at 85% 10%,
          #cfdcff 0%,
          #e7eeff 38%,
          #f5f8ff 70%,
          #ffffff 100%
        );
      }
      .arc {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(0, 62, 168, 0.1);
      }
      .glow {
        position: absolute;
        left: 60px;
        right: 30px;
        bottom: 52px;
        height: 40px;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          rgba(0, 62, 168, 0.28),
          rgba(0, 62, 168, 0)
        );
        filter: blur(6px);
      }
      .lid {
        position: absolute;
        left: 78px;
        top: 92px;
        width: 380px;
        height: 244px;
        border-radius: 16px;
        background: linear-gradient(160deg, #1b2333, #0b0f18);
        padding: 10px 10px 12px;
        box-shadow: 0 30px 60px -20px rgba(8, 24, 72, 0.45);
      }
      .cam {
        position: absolute;
        top: 4px;
        left: 50%;
        width: 5px;
        height: 5px;
        margin-left: -2.5px;
        border-radius: 50%;
        background: #2a3346;
      }
      .scr {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 7px;
        overflow: hidden;
        background: #0d1320;
      }
      .base {
        position: absolute;
        left: 46px;
        top: 334px;
        width: 444px;
        height: 14px;
        border-radius: 2px 2px 14px 14px;
        background: linear-gradient(#e9edf5, #b9c1d0);
        box-shadow: 0 8px 18px -6px rgba(8, 24, 72, 0.35);
      }
      .notch {
        position: absolute;
        left: 50%;
        top: 0;
        width: 70px;
        height: 5px;
        margin-left: -35px;
        border-radius: 0 0 6px 6px;
        background: #c4cbd8;
      }
      .bar {
        height: 22px;
        display: flex;
        align-items: center;
        padding: 0 8px;
        gap: 6px;
        background: #111a2b;
        color: #cfd8ea;
        font-size: 8.5px;
        font-weight: 600;
      }
      .live {
        background: #e5484d;
        color: #fff;
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 7.5px;
        letter-spacing: 0.04em;
      }
      .main {
        display: flex;
        gap: 6px;
        padding: 6px;
        height: calc(100% - 22px - 24px);
      }
      .slide {
        flex: 1.55;
        border-radius: 6px;
        background: linear-gradient(160deg, #ffffff, #eef3ff);
        padding: 10px 11px;
        position: relative;
        overflow: hidden;
      }
      .slide h4 {
        font-size: 11px;
        color: #0b1b3f;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .slide p {
        font-size: 7px;
        color: #5b6b8c;
        margin-top: 2px;
      }
      .bars {
        position: absolute;
        left: 11px;
        right: 11px;
        bottom: 10px;
        height: 86px;
        display: flex;
        align-items: flex-end;
        gap: 7px;
      }
      .bars i {
        flex: 1;
        border-radius: 3px 3px 1px 1px;
        background: linear-gradient(#3c78e6, #003ea8);
      }
      .bars i.l {
        background: linear-gradient(#a9c3f5, #7aa0ea);
      }
      .grid {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }
      .tile {
        border-radius: 5px;
        overflow: hidden;
        position: relative;
      }
      .tile .spk {
        position: absolute;
        right: 3px;
        top: 3px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.35);
      }
      .tile img {
        position: absolute;
        inset: 0;
      }
      .tile .nm {
        z-index: 1;
        position: absolute;
        left: 3px;
        bottom: 3px;
        font-size: 6px;
        color: #fff;
        background: rgba(0, 0, 0, 0.35);
        padding: 0 3px;
        border-radius: 3px;
      }
      .ctl {
        height: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
      }
      .ctl b {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #26324a;
        display: block;
      }
      .ctl b.end {
        width: 24px;
        border-radius: 8px;
        background: #e5484d;
      }
      .card {
        position: absolute;
        background: #fff;
        border-radius: 12px;
        box-shadow:
          0 18px 36px -12px rgba(8, 30, 90, 0.35),
          0 2px 6px rgba(8, 30, 90, 0.08);
        padding: 10px 11px;
      }
      .k {
        font-size: 8px;
        color: #5b6b8c;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .v {
        font-size: 19px;
        font-weight: 800;
        color: #0b1b3f;
        letter-spacing: -0.02em;
        margin-top: 2px;
      }
      .up {
        font-size: 8.5px;
        color: #0e9f6e;
        font-weight: 700;
        margin-left: 4px;
      }
      .badge {
        position: absolute;
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 14px 28px -10px rgba(8, 30, 90, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .spark {
        position: absolute;
        left: 58px;
        top: 24px;
        width: 3px;
        height: 9px;
        border-radius: 2px;
        background: #3c78e6;
      }
      .pb {
        height: 6px;
        border-radius: 4px;
        background: #e8eefc;
        margin-top: 4px;
        overflow: hidden;
      }
      .pb i {
        display: block;
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, #003ea8, #3c78e6);
      }
      .pl {
        display: flex;
        justify-content: space-between;
        font-size: 7.5px;
        color: #33415e;
        margin-top: 5px;
        font-weight: 600;
      }
    </style>
  </head>

              background: #e1e8f8;
            "
          ></div>
        </div>
        <div
          class="card"
          style="
            left: 62px;
            top: 0;
            width: 110px;
            height: 72px;
            padding: 8px 9px;
            transform: rotate(4deg);
          "
        >
          <div class="k" style="font-size: 7px">Slides · 4 / 12</div>
          <div
            style="
              font-size: 10px;
              font-weight: 800;
              color: #0b1b3f;
              margin-top: 3px;
            "
          >
            Roadmap 2027
          </div>
          <div
            style="
              display: flex;
              gap: 3px;
              margin-top: 6px;
              align-items: flex-end;
              height: 22px;
            "
          >
            <i
              style="
                flex: 1;
                height: 40%;
                background: #a9c3f5;
                border-radius: 2px;
              "
            ></i
            ><i
              style="
                flex: 1;
                height: 65%;
                background: #3c78e6;
                border-radius: 2px;
              "
            ></i
            ><i
              style="
                flex: 1;
                height: 100%;
                background: #003ea8;
                border-radius: 2px;
              "
            ></i
            ><i
              style="
                flex: 1;
                height: 80%;
                background: #3c78e6;
                border-radius: 2px;
              "
            ></i>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Real people (Unsplash License, see CREDITS.md): Ngozi and Tunde (African), Mia, Ken.
      const people = [
        ["ngozi", "Ngozi"],
        ["ken", "Ken"],
        ["tunde", "Tunde"],
        ["mia", "Mia"],
      ];
      const ph = (f, pos) =>
        '<img src="photos/' +
        f +
        '.jpg" alt="" style="width:100%;height:100%;object-fit:cover;object-position:' +
        (pos || "50% 30%") +
        ';display:block">';
      document.getElementById("grid").innerHTML = people
        .map(
          ([f, n], i) =>
            '<div class="tile"' +
            (i === 0 ? ' style="box-shadow:inset 0 0 0 2px #3c78e6"' : "") +
            ">" +
            ph(f) +
            '<span class="nm">' +
            n +
            "</span>" +
            (i === 0 ? '<span class="spk"></span>' : "") +
            "</div>",
        )
        .join("");
      document.getElementById("faces").innerHTML =
        people
          .map(
            ([f], i) =>
              '<div style="width:18px;height:18px;border-radius:50%;overflow:hidden;border:2px solid #fff;margin-left:' +
              (i ? -5 : 0) +
              'px">' +
              ph(f, "50% 25%") +
              "</div>",
          )
          .join("") +
        '<div style="width:18px;height:18px;border-radius:50%;border:2px solid #fff;margin-left:-5px;background:#003EA8;color:#fff;font-size:6.5px;font-weight:700;display:flex;align-items:center;justify-content:center">+9</div>';
    </script>
  </body>
</html>
